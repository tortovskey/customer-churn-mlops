name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          DEBUG: "false"
          DATABASE_URL: sqlite+pysqlite:///./ci_test.db
          MLFLOW_TRACKING_URI: file:./mlruns
          MODEL_STORAGE_DIR: ./app/ml/model_storage
          TRAINING_ROWS: 500
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t churn-backend ./backend
