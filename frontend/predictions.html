<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChurnOps | Прогнозы</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/api.js"></script>
    <script defer src="js/predictions.js"></script>
  </head>
  <body>
    <header class="topbar">
      <nav class="shell nav">
        <a class="brand" href="index.html"><span class="brand-mark">C</span>ChurnOps</a>
        <div class="nav-links">
          <a href="clients.html">Клиенты</a>
          <a href="predictions.html">Прогнозы</a>
          <a href="ml_dashboard.html">MLOps</a>
        </div>
      </nav>
    </header>

    <main class="shell">
      <div class="page-head">
        <div>
          <h1>История прогнозов</h1>
          <p class="lead">Каждая запись связывает клиента, вероятность оттока и версию активной модели.</p>
        </div>
        <div class="status" data-predictions-status></div>
      </div>

      <section class="card">
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Клиент</th>
                  <th>Вероятность</th>
                  <th>Класс</th>
                  <th>Версия</th>
                  <th>Дата</th>
                </tr>
              </thead>
              <tbody data-predictions-table></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="shell">Prediction history</footer>
  </body>
</html>
